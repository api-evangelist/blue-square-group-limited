apis:
- name: GRVT Market Data API
  description: >-
    Public market-data API for GRVT — instruments, currencies, supported assets, margin rules, mini/full
    tickers, orderbook levels, trades, trade history, candlesticks, and funding rates. No authentication
    required. Real-time equivalents are available over WebSocket streams.
  humanURL: https://api-docs.grvt.io/
  baseURL: https://market-data.grvt.io
  tags:
  - Market Data
  - Cryptocurrency
  - Trading
  properties:
  - type: AsyncAPI
    url: asyncapi/blue-square-group-limited-streams.yml
- name: GRVT Trading API
  description: >-
    Authenticated trading API for GRVT — create/cancel orders (single, bulk, TP/SL, trigger), open orders
    and order history, fills, positions and position history, margin management, sub-account and funding
    summaries, transfers/deposits/withdrawals, and vault invest/redeem. Requires API-key login plus ECDSA
    request signing.
  humanURL: https://api-docs.grvt.io/
  baseURL: https://trades.grvt.io
  tags:
  - Trading
  - Derivatives Exchange
  - Perpetual Futures
