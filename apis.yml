aid: blue-square-group-limited
name: Blue Square Group Limited
description: >-
  Blue Square Group Limited is the corporate entity behind GRVT (pronounced "gravity"), a licensed
  hybrid crypto derivatives exchange headquartered in Singapore and engineered by Gravity Technologies.
  GRVT pairs a high-performance central limit order book with self-custody settlement on a zkSync-based
  Layer 2, and exposes a public Market Data API and an authenticated Trading API over both REST and
  WebSocket. The APIs cover perpetual futures and spot trading, order management (including bulk orders,
  TP/SL and trigger orders), positions and margin, sub-account and funding-account summaries, transfers,
  deposits and withdrawals, and on-chain vault investment and redemption. Authentication combines an
  API-key login with Ethereum-style ECDSA (secp256k1 / EIP-712) request signing and scoped session keys.
  First-party Python and JavaScript/TypeScript SDKs plus published agent skills round out the developer surface.
  Surfaced as a portfolio company of 500 Global and enriched into the API Evangelist network.
